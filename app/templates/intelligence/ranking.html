<div class="ranking-list">{% for row in top_clientes %}<a class="ranking-row clickable" href="{{ url_for('cases.index', case_ids=row.case_ids|join(','), base_id=row.base_id, next=request.full_path) }}"><div><strong>{{ row.base }} · {{ row.nome }}</strong><span>{{ row.endereco }} · {{ row.abertos }} em aberto</span></div><b>{{ row.total }}</b><small>R$ {{ '%.2f'|format(row.valor) }}</small></a>{% else %}<div class="empty">Sem clientes reincidentes no período.</div>{% endfor %}</div>
